[package]
name = "link-protection-system"
version = "1.0.0"
description = "Lightweight desktop link protection and anti-phishing system"
authors = ["Link Protection Team"]
edition = "2021"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows = { version = "0.52", features = ["UI_Notifications", "UI_Notifications_Management", "ApplicationModel", "Foundation", "Foundation_Collections", "Win32", "Win32_Foundation", "Win32_System_Com", "Data_Xml_Dom", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
tokio = { version = "1", features = ["sync", "time", "net", "macros"] }
url = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "json"] }
native-tls = "0.2"
x509-parser = "0.16"
subtle = "2.6.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
