<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BaitZero — Browser Guard</title>
  <style>
    :root {
      --bg: #050408;
      --bg-surface: #100B18;
      --bg-elevated: #171021;
      --bg-input: #0C0814;
      --border: #2A1C3B;
      --border-light: #3A2752;
      --border-dim: #1B1226;
      --text: #F5F0FF;
      --text-2: #A49AAF;
      --text-3: #867996;
      --accent: #7C3CFF;
      --accent-bright: #A970FF;
      --risk-low: #22C55E;
      --risk-low-bg: rgba(34, 197, 94, 0.12);
      --risk-med: #F59E0B;
      --risk-med-bg: rgba(245, 158, 11, 0.12);
      --risk-high: #EF4444;
      --risk-high-bg: rgba(239, 68, 68, 0.12);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.4;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .header-title {
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }

    .header-icon {
      color: var(--accent-bright);
      display: flex;
      align-items: center;
    }

    .badge-status {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge-status.active {
      background: var(--risk-low-bg);
      color: var(--risk-low);
      border: 1px solid rgba(34, 197, 94, 0.35);
    }

    .badge-status.paused {
      background: var(--risk-med-bg);
      color: var(--risk-med);
      border: 1px solid rgba(245, 158, 11, 0.35);
    }

    .badge-status.offline {
      background: rgba(134, 121, 150, 0.14);
      color: var(--text-2);
      border: 1px solid var(--border);
    }

    .status-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .status-row:last-child {
      margin-bottom: 0;
    }

    .status-label {
      color: var(--text-2);
      font-size: 12px;
    }

    .status-value {
      font-weight: 500;
      font-size: 12px;
      color: var(--text);
    }

    .token-section {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .token-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-3);
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .token-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      padding: 6px 8px;
      margin-bottom: 8px;
      outline: none;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }

    .token-input:focus {
      border-color: var(--accent-bright);
      box-shadow: 0 0 0 2px rgba(169, 112, 255, 0.2);
    }

    .token-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      font-family: var(--font);
      font-size: 12px;
      font-weight: 500;
      padding: 7px 12px;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 2px 10px rgba(124, 60, 255, 0.3);
      flex: 1;
    }

    .btn-primary:hover {
      background: #8B4AFF;
      box-shadow: 0 4px 14px rgba(124, 60, 255, 0.45);
    }

    .btn-primary:focus-visible {
      outline: 2px solid var(--accent-bright);
      outline-offset: 1px;
    }

    .btn-secondary {
      background: var(--bg-elevated);
      color: var(--text-2);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border-light);
      color: var(--text);
    }

    .btn-secondary:focus-visible {
      outline: 2px solid var(--accent-bright);
      outline-offset: 1px;
    }

    .notice {
      font-size: 11px;
      color: var(--text-3);
      line-height: 1.4;
      text-align: center;
    }

    .msg-feedback {
      font-size: 11px;
      margin-top: 6px;
      display: none;
    }

    .msg-feedback.success {
      color: var(--risk-low);
      display: block;
    }

    .msg-feedback.error {
      color: var(--risk-high);
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">
      <span class="header-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </span>
      <span>BaitZero Guard</span>
    </div>
    <span class="badge-status offline" id="badge-status">Checking...</span>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span class="status-label">Desktop Connection</span>
      <span class="status-value" id="val-connection">—</span>
    </div>
    <div class="status-row">
      <span class="status-label">Protection State</span>
      <span class="status-value" id="val-protection">—</span>
    </div>
    <div class="status-row">
      <span class="status-label">Local Endpoint</span>
      <span class="status-value" style="font-family: monospace;">127.0.0.1:27432</span>
    </div>
  </div>

  <div class="token-section">
    <div class="token-label">
      <span>Extension Auth Token</span>
      <span id="token-status" style="text-transform: none; color: var(--text-2);"></span>
    </div>
    <input type="password" class="token-input" id="token-input" placeholder="Paste 64-char security token..." />
    <div class="token-actions">
      <button class="btn btn-primary" id="btn-save-token">Save Token</button>
      <button class="btn btn-secondary" id="btn-clear-cache">Clear Cache</button>
    </div>
    <div class="msg-feedback" id="msg-feedback"></div>
  </div>

  <div class="notice">
    Navigation URLs are analyzed strictly on your device via the local BaitZero desktop application. No cloud servers are contacted.
  </div>

  <script src="popup.js"></script>
</body>
</html>
